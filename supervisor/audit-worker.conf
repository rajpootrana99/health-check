; =============================================================================
; Supervisor configuration — Business Audit Queue Workers
; =============================================================================
;
; Installation (Ubuntu/Debian):
;   sudo apt install supervisor
;   sudo cp supervisor/audit-worker.conf /etc/supervisor/conf.d/audit-worker.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start audit-*
;
; Check status:
;   sudo supervisorctl status
;
; Reload after deploy:
;   sudo supervisorctl restart audit-*
; =============================================================================

; -----------------------------------------------------------------------------
; Default queue — FetchBusinessesJob, BuildReportPdfJob, GenerateEmailJob
; Low concurrency — these are orchestrators that dispatch to other queues.
; -----------------------------------------------------------------------------
[program:audit-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis
    --queue=default
    --sleep=3
    --tries=3
    --timeout=120
    --max-jobs=500
    --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/audit/worker-default.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=130

; -----------------------------------------------------------------------------
; Scraping queue — ScrapeBusinessJob
; Higher concurrency — pure IO (HTTP requests), safe to parallelise.
; -----------------------------------------------------------------------------
[program:audit-worker-scraping]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis
    --queue=scraping
    --sleep=3
    --tries=3
    --timeout=90
    --max-jobs=500
    --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=3
redirect_stderr=true
stdout_logfile=/var/log/audit/worker-scraping.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=100

; -----------------------------------------------------------------------------
; AI queue — GenerateReportJob
; Limited concurrency — respect Claude API rate limits.
; Each job can take up to 60s; 2 workers = 2 concurrent AI calls.
; -----------------------------------------------------------------------------
[program:audit-worker-ai]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis
    --queue=ai
    --sleep=5
    --tries=3
    --timeout=120
    --max-jobs=200
    --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/audit/worker-ai.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=130

; -----------------------------------------------------------------------------
; Email queue — SendEmailJob
; Single worker — weekly limit enforced inside the job.
; One worker prevents race conditions on the weekly counter.
; -----------------------------------------------------------------------------
[program:audit-worker-email]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis
    --queue=email
    --sleep=3
    --tries=3
    --timeout=60
    --max-jobs=500
    --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/audit/worker-email.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=70

; -----------------------------------------------------------------------------
; Group — restart all workers at once
; -----------------------------------------------------------------------------
[group:audit]
programs=audit-worker-default,audit-worker-scraping,audit-worker-ai,audit-worker-email
priority=999
